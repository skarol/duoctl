name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      TAP: skarol/homebrew-tap
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"; exit 1
          fi

      - name: Bump version
        run: |
          sed -i -E "s/^VERSION = \".*\"/VERSION = \"${VERSION}\"/" skills/duoctl/scripts/duoctl
          grep -q "^VERSION = \"${VERSION}\"" skills/duoctl/scripts/duoctl
          sed -i -E "s#/v[0-9.]+\.tar\.gz#/${TAG}.tar.gz#" packaging/homebrew/duoctl.rb

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${VERSION}"
          git tag "$TAG"
          git push origin HEAD "$TAG"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$VERSION" --generate-notes

      - name: Publish Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SHA256=$(curl -sfL "$URL" | shasum -a 256 | awk '{print $1}')
          sed -e '/^# /d' -e "s#^  url .*#  url \"${URL}\"#" -e "s#^  sha256 .*#  sha256 \"${SHA256}\"#" \
            packaging/homebrew/duoctl.rb > duoctl.rb
          EXISTING_SHA=$(gh api "repos/${TAP}/contents/Formula/duoctl.rb" --jq .sha 2>/dev/null || true)
          gh api -X PUT "repos/${TAP}/contents/Formula/duoctl.rb" \
            -f message="duoctl ${VERSION}" \
            -f content="$(base64 -w0 duoctl.rb)" \
            ${EXISTING_SHA:+-f sha="$EXISTING_SHA"}
